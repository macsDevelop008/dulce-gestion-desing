name: dulce_gestion
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.6
  go_router: ^12.1.3          # Manejo de rutas
  flutter_dotenv: ^5.1.0      # Variables de entorno
  logger: ^2.3.0              # Mejora de comentarios
  flutter_svg: ^2.0.10+1      # Manejo de archivos .svg
  riverpod: ^2.5.1            # Manejador de estados

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.0

flutter:


  uses-material-design: true


  assets:
    - .env
    - assets/logos/
    - assets/loading/




  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/baloo2/Baloo2-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/baloo2/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/baloo2/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/baloo2/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/baloo2/Baloo2-Regular.ttf
          weight: 400